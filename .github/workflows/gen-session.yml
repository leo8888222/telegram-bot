name: Generate Telethon Session
on:
  workflow_dispatch:
    inputs:
      phone_code:
        description: 'Telegram 验证码（先空着运行一次触发发送）'
        required: false
        default: ''
      phone_code_hash:
        description: '第一次运行输出的 code hash'
        required: false
        default: ''
      password_2fa:
        description: '两步验证密码'
        required: false
        default: ''
permissions:
  issues: read
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - run: pip install telethon
      - run: |
          python3 << 'PYEOF'
          import asyncio
          import json
          import os
          import sys
          import time
          import urllib.request
          from datetime import datetime, timezone
          from telethon import TelegramClient
          from telethon.sessions import StringSession
          from telethon.errors import SessionPasswordNeededError
          API_ID = 35211107
          API_HASH = 'f43fd35f97579cada9527771c38da759'
          PHONE = '+12546483258'
          PWD2FA = '789000'
          ISSUE_NUMBER = 1
          REPO = 'leo8888222/telegram-bot'
          TOKEN = os.environ['GITHUB_TOKEN']
          def get_comments():
              url = f'https://api.github.com/repos/{REPO}/issues/{ISSUE_NUMBER}/comments?per_page=100'
              req = urllib.request.Request(url, headers={
                  'Authorization': f'Bearer {TOKEN}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.load(resp)
          def looks_like_code(body):
              b = (body or '').strip()
              return len(b) == 5 and b.isdigit()
          async def main():
              c = TelegramClient(StringSession(), API_ID, API_HASH)
              await c.connect()
              r = await c.send_code_request(PHONE)
              code_hash = r.phone_code_hash
              print(f'SESSION_GEN: CODE_SENT hash={code_hash}', flush=True)
              print('SESSION_GEN: WAITING_FOR_CODE_IN_ISSUE', flush=True)
              sent_at = datetime.now(timezone.utc)
              deadline = time.monotonic() + 300
              code = None
              while time.monotonic() < deadline:
                  await asyncio.sleep(10)
                  try:
                      comments = await asyncio.to_thread(get_comments)
                  except Exception as e:
                      print(f'SESSION_GEN: poll error: {e}', flush=True)
                      continue
                  for cm in comments:
                      if not looks_like_code(cm.get('body')):
                          continue
                      try:
                          cdt = datetime.fromisoformat(cm.get('created_at', '').replace('Z', '+00:00'))
                      except Exception:
                          continue
                      if cdt >= sent_at:
                          code = cm.get('body').strip()
                          break
                  if code:
                      break
              if not code:
                  print('SESSION_GEN: TIMEOUT_NO_CODE', flush=True)
                  await c.disconnect()
                  sys.exit(1)
              print('SESSION_GEN: CODE_RECEIVED', flush=True)
              try:
                  await c.sign_in(PHONE, code, phone_code_hash=code_hash)
              except SessionPasswordNeededError:
                  await c.sign_in(password=PWD2FA)
              s = c.session.save()
              print(f'SESSION_GEN_OK:{s}', flush=True)
              await c.disconnect()
          asyncio.run(main())
          PYEOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
