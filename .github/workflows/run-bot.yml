name: Run Telegram Bot



on:

  push:
  
    branches: [main]
    
  workflow_dispatch:
  
  schedule:
  
    - cron: '0 */5 * * *'
    


jobs:

  run-bot:
  
    runs-on: ubuntu-latest
    
    timeout-minutes: 350
    
    steps:
    
      - uses: actions/checkout@v4
      
      - name: Set up Python
      
        uses: actions/setup-python@v5
        
        with:
        
          python-version: '3.11'
          
      - name: Install dependencies
      
        run: pip install -r requirements.txt
        
      - name: Run bot
      
        run: python bot.py
















