name: Generate TG Session via QR
on:
  workflow_dispatch:
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install telethon -q
      - name: QR Login
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          python - <<'EOF'
          import asyncio, os
          from telethon import TelegramClient
          from telethon.sessions import StringSession

          async def main():
              c = TelegramClient(StringSession(), int(os.environ["TG_API_ID"]), os.environ["TG_API_HASH"])
              await c.connect()
              print("等待扫码...", flush=True)
              qr = await c.qr_login()
              print("QR_URL_START", flush=True)
              print(qr.url, flush=True)
              print("QR_URL_END", flush=True)
              print("请用 Telegram 手机 App 扫码或点击上面的链接", flush=True)
              await qr.wait(timeout=300)
              print("扫码成功！", flush=True)
              s = c.session.save()
              print("SESSION_STRING_START", flush=True)
              print(s, flush=True)
              print("SESSION_STRING_END", flush=True)
              await c.disconnect()

          asyncio.run(main())
          EOF
