name: Test Telegram MTProto
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: pip install telethon
      - run: |
          python3 << 'PYEOF'
          import asyncio
          from telethon import TelegramClient
          from telethon.sessions import StringSession
          async def main():
              try:
                  async with TelegramClient(StringSession(), 35211107, 'f43fd35f97579cada9527771c38da759') as c:
                      await c.send_code_request('+12546483258')
                      print('MTPROTO_OK_CODE_SENT')
              except Exception as e:
                  print(f'MTPROTO_FAIL: {type(e).__name__}: {str(e)[:200]}')
          asyncio.run(main())
          PYEOF
