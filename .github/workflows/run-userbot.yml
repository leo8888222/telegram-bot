name: Run Userbot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

# 防止多实例同时运行导致 session 冲突
concurrency:
  group: userbot-singleton
  cancel-in-progress: false

jobs:
  run-userbot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install telethon httpx
      - name: Run userbot
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python userbot.py
