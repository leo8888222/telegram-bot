name: Daily Tech News

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

jobs:
  post-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Post tech news to channel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL: "@freenodes_daily"
        run: python post_tech_news.py
